<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Workflow integrity and defense visibility</title>
  <desc id="desc">A legitimate task passes through planner-visible tool calls to a task result. Tool-internal actions form a separate observation boundary, and their visibility depends on defense instrumentation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#94a3b8" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1120" height="300" rx="20" fill="#0f172a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="34" y="37" fill="#94a3b8" font-size="12" letter-spacing="2">CHAINFORGE · WORKFLOW INTEGRITY</text>
    <rect x="34" y="65" width="232" height="86" rx="13" fill="#1e293b" stroke="#334155"/>
    <text x="150" y="101" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Legitimate task</text>
    <text x="150" y="126" text-anchor="middle" fill="#94a3b8" font-size="13">User intent and authorization</text>
    <path d="M280 108 H343" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="360" y="65" width="400" height="86" rx="13" fill="#252448" stroke="#a78bfa"/>
    <text x="560" y="101" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Planner-visible tool calls</text>
    <text x="560" y="126" text-anchor="middle" fill="#c4b5fd" font-size="13">What a trace-level defense can observe</text>
    <path d="M776 108 H838" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="854" y="65" width="232" height="86" rx="13" fill="#1e293b" stroke="#334155"/>
    <text x="970" y="101" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Task result</text>
    <text x="970" y="126" text-anchor="middle" fill="#94a3b8" font-size="13">User-visible task completion</text>
    <path d="M560 151 V183" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="360" y="185" width="400" height="74" rx="13" fill="#172036" stroke="#64748b" stroke-dasharray="5 5"/>
    <text x="560" y="215" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">Tool-internal actions</text>
    <text x="560" y="240" text-anchor="middle" fill="#94a3b8" font-size="13">Visibility depends on instrumentation</text>
    <text x="34" y="279" fill="#64748b" font-size="12">Conceptual overview · Coverage is specific to the evaluated defense configuration.</text>
  </g>
</svg>
